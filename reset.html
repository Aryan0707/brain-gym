<!doctype html>
<meta charset="utf-8">
<title>Reset B.R.A.I.N.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0e10; color: #f2f5f1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #c9d3ce; font-size: 15px; margin: 0 0 24px; max-width: 320px; line-height: 1.4; }
  button {
    border: none; border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 600;
    cursor: pointer; display: block; width: 100%; max-width: 280px; margin: 0 auto 12px;
  }
  .btn-danger { background: #fb7185; color: #122219; }
  .btn-ghost { background: transparent; color: #9fa9a5; border: 1px solid #2c3637; }
</style>

<script>
  const CONFIRM_TEXT = 'RESET';

  function doReset() {
    const keys = Object.keys(localStorage).filter(key => key.startsWith('braingym.'));
    keys.forEach(key => localStorage.removeItem(key));
    window.location.replace('./');
  }

  function ask() {
    const input = prompt('Type RESET to confirm you want to erase all progress. This cannot be undone.');
    if (input === CONFIRM_TEXT) {
      doReset();
    } else if (input !== null) {
      alert('Reset cancelled — you must type RESET exactly.');
    }
    // null = user cancelled prompt, do nothing
  }

  // Fallback for automated environments: expose a direct reset function
  // that still requires the exact string (not confirm() which returns boolean).
  window._resetBrainGym = function(code) {
    if (code !== CONFIRM_TEXT) return false;
    doReset();
    return true;
  };
</script>

<h1>Reset B.R.A.I.N.</h1>
<p>This erases all your progress — reps, notes, streak, and custom reels. There is no undo.</p>
<button class="btn-danger" onclick="ask()">Erase everything</button>
<button class="btn-ghost" onclick="window.location.replace('./')">Cancel and go back</button>
